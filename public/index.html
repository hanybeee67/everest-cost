<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>메뉴 원가 분석</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>

<div id="boot" class="boot"><div class="spinner"></div><p>원가 데이터를 불러오는 중…</p></div>

<div id="app" hidden>

  <!-- ══════════ 사이드바 (PC) ══════════ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🏔️</div>
      <div>
        <strong id="brandName">–</strong>
        <span>메뉴 원가 분석</span>
      </div>
    </div>
    <nav class="nav" id="navDesktop"></nav>
    <div class="sidebar-foot">
      <button class="btn btn-block authbtn" id="btnAuthSide">🔒 관리자 로그인</button>
      <div class="sync" id="syncBox"><span class="dot"></span><span id="syncText">동기화됨</span></div>
      <button class="btn btn-primary btn-block" id="btnExcel">엑셀 내려받기</button>
      <button class="btn btn-block" id="btnPortable">이 값 그대로 파일 저장</button>
      <div class="row-2">
        <button class="btn btn-ghost" id="btnBackup">백업</button>
        <button class="btn btn-ghost" id="btnRestore">복원</button>
      </div>
      <button class="btn btn-ghost btn-block btn-danger" id="btnReset">수정값 초기화</button>
      <input type="file" id="fileRestore" accept="application/json" hidden>
      <div class="license-foot" id="licenseFoot" hidden></div>
    </div>
  </aside>

  <!-- ══════════ 본문 ══════════ -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="viewTitle">대시보드</h1>
        <p id="viewDesc"></p>
      </div>
      <div class="topbar-actions">
        <span class="sync-pill only-mobile-inline" id="syncMobile">저장됨</span>
        <button class="icon-btn" id="btnAuth" title="관리자 로그인">🔒</button>
        <button class="icon-btn no-mobile" id="btnUndo" title="되돌리기 (Ctrl+Z)" disabled>↶</button>
        <button class="icon-btn no-mobile" id="btnRedo" title="다시 실행 (Ctrl+Shift+Z)" disabled>↷</button>
        <button class="icon-btn" id="btnTheme" title="화면 밝기 전환">◐</button>
        <button class="icon-btn only-mobile" id="btnMenu" title="메뉴">⋯</button>
      </div>
    </header>

    <div class="viewlock" id="viewLockBanner" hidden>
      🔒 <b>보기 전용 모드입니다.</b>
      <span class="viewlock-more">메뉴·식재료·고정비를 수정하려면 관리자 로그인을 해 주세요.</span>
      <button class="viewlock-btn" id="viewLockBtn">관리자 로그인</button>
    </div>
    <div class="savewarn" id="saveWarn" hidden>
      ⚠️ <b>이 브라우저에 자동 저장을 할 수 없습니다.</b>
      시크릿(비공개) 모드이거나 저장공간이 막혀 있습니다.
      고친 값을 잃지 않으려면 <b>[백업]</b> 으로 파일을 저장해 두세요.
      <button class="savewarn-x" id="saveWarnClose" aria-label="닫기">✕</button>
    </div>
    <div class="scroll" id="viewRoot"></div>
  </main>

  <!-- ══════════ 하단 탭 (모바일) ══════════ -->
  <nav class="tabbar" id="navMobile"></nav>

  <!-- ══════════ 상세 시트 ══════════ -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
    <header class="sheet-head">
      <div>
        <h2 id="sheetTitle"></h2>
        <p id="sheetSub"></p>
      </div>
      <button class="icon-btn" id="sheetClose" aria-label="닫기">✕</button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <!-- ══════════ 모바일 더보기 ══════════ -->
  <div class="popover" id="morePop" hidden>
    <button data-act="undo" id="popUndo">↶ 되돌리기</button>
    <button data-act="redo" id="popRedo">↷ 다시 실행</button>
    <button data-act="excel">엑셀 내려받기</button>
    <button data-act="portable">이 값 그대로 파일 저장</button>
    <button data-act="backup">백업 파일 저장</button>
    <button data-act="restore">백업 복원</button>
    <button data-act="reset" class="danger">수정값 초기화</button>
  </div>

  <!-- ══════════ 관리자 로그인 ══════════ -->
  <div class="sheet-backdrop" id="loginBackdrop" hidden></div>
  <section class="login-modal" id="loginModal" hidden aria-modal="true" role="dialog">
    <header>
      <h2>관리자 로그인</h2>
      <button class="icon-btn" id="loginClose" aria-label="닫기">✕</button>
    </header>
    <p class="login-desc" id="loginDesc">메뉴·식재료·고정비를 수정하려면 관리자 아이디와 비밀번호가 필요합니다.</p>
    <div class="login-body">
      <label>아이디<input type="text" id="loginId" autocomplete="username"></label>
      <label>비밀번호<input type="password" id="loginPw" autocomplete="current-password"></label>
      <div class="login-error" id="loginError" hidden></div>
      <button class="btn btn-primary btn-block" id="loginSubmit">로그인</button>
      <a href="#" id="loginForgot" class="login-forgot">비밀번호를 잊으셨나요? 계정 초기화</a>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
</div>

<!-- 인쇄용 레시피 카드가 그려지는 곳 (화면에는 보이지 않음) -->
<div id="printRoot" aria-hidden="true"></div>

<script id="ovData" type="application/json">null</script>
<script src="/calc.js"></script>
<script src="/app.js"></script>
</body>
</html>
